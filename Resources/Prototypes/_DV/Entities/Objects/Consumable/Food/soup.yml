- type: entity
  name: blue tomato soup
  parent: FoodBowlBase
  id: FoodSoupTomatoBlue
  description: It's hard to avoid spilling this tomato soup...
  components:
  - type: FlavorProfile
    flavors:
      - funny
      - tomato
  - type: Sprite
    sprite: _DV/Objects/Consumable/Food/bluepurpletomatosoup.rsi
    layers:
    - state: bowl
    - state: blue-tomato
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 12
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: SpaceLube
          Quantity: 6
        - ReagentId: Water
          Quantity: 3
  - type: Tag
    tags:
    - Fruit
    - Soup

