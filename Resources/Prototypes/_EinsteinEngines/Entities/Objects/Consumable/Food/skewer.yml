# BEGIN EINSTEIN ENGINES - Kebabs (EE #3436)
- type: entity
  name: double rat kebab
  parent: FoodKebabSkewer
  id: FoodMeatRatdoubleKebab
  description: A double serving of not so delicious rat meat, on a stick.
  components:
  - type: Sprite
    layers:
      - state: skewer
      - state: skewer-rat
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 12
        - ReagentId: Vitamin
          Quantity: 6

- type: entity
  name: fiesta kebab
  parent: FoodKebabSkewer
  id: FoodMeatFiestaKebab
  description: Always a cruise ship party somewhere in the world, right?
  components:
  - type: Sprite
    layers:
      - state: skewer
      - state: skewer-pepper
      - state: skewer-corn
      - state: skewer-mushroom
      - state: skewer-tomato

- type: entity
  name: snake kebab
  parent: FoodKebabSkewer
  id: FoodMeatSnakeKebab
  description: Snake meat on a stick. It's a little tough.
  components:
  - type: Sprite
    layers:
      - state: skewer
      - state: skewer-snake
  - type: SolutionContainerManager
    solutions:
      food:
        canReact: false
        maxVol: 0
  - type: FoodSequenceStartPoint
    key: Skewer
    maxLayers: 4
    startPosition: -0.27, -0.19
# END EINSTEIN ENGINES